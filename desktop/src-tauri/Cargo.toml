[package]
name = "grokdesk"
version = "0.6.27"
description = "GrokDesk — desktop ACP workspace for official Grok Build"
authors = ["xiaoha"]
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
dirs = "6"
rfd = "0.15"
arboard = "3"
png = "0.17"
base64 = "0.22"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[dev-dependencies]
serde_json = "1"

# Production builds must enable this, otherwise the app tries to load
# http://localhost:1420 (the Vite dev server) and Windows shows
# ERR_CONNECTION_REFUSED. `tauri dev` should pass --no-default-features.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
